  for (const phase of PHASES) {

  const allScreens = PHASES.flatMap((p) => p.screens);
  const idx = allScreens.indexOf(screenKey);
  if (idx < 0) return 0;
  return Math.round(((idx + 1) / allScreens.length) * 100);
}

/* ---------- SCORING ENGINE ---------- */

/* For each scoring screen, the max possible per tenet = highest option score for that tenet */
function getScreenMaxScores(screen) {
  if (!screen.options) return {};
  const max = {};
  screen.options.forEach((opt) => {
    Object.entries(opt.scores || {}).forEach(([tenet, val]) => {
      if (max[tenet] === undefined || val > max[tenet]) {
        max[tenet] = val;
      }
    });
  });
  return max;
}

/* Apply a choice: add chosen scores to raw, max scores to max */
function applyChoice(state, screenKey, optionId) {
  const screen = SCREENS[screenKey];
  if (!screen || !screen.options) return state;
  const option = screen.options.find((o) => o.id === optionId);
  if (!option) return state;

  const newScores = { ...state.scores };
  const newMaxScores = { ...state.maxScores };
  const screenMax = getScreenMaxScores(screen);

  Object.entries(option.scores || {}).forEach(([tenet, val]) => {
    newScores[tenet] = (newScores[tenet] || 0) + val;
  });
  Object.entries(screenMax).forEach(([tenet, val]) => {
    newMaxScores[tenet] = (newMaxScores[tenet] || 0) + val;
  });

  return {
    ...state,
    scores: newScores,
    maxScores: newMaxScores,
    history: [...state.history, { screen: screenKey, optionId, scores: option.scores }],
  };
}

/* Branching gates */
function resolveNextScreen(state, screenKey) {
  const screen = SCREENS[screenKey];
  if (!screen) return null;

  if (screen.next === 'BRANCH_RAHUL') {
    // RI score from screens 09 + 10
    const ri09 = state.history.find((h) => h.screen === 'screen09')?.scores?.RI || 0;
    const ri10 = state.history.find((h) => h.screen === 'screen10')?.scores?.RI || 0;
    const combinedRI = ri09 + ri10;
    return combinedRI >= 4 ? 'screen11' : 'screen11A';
  }

  if (screen.next === 'BRANCH_MEERA') {
    const ri15 = state.history.find((h) => h.screen === 'screen15')?.scores?.RI || 0;
    return ri15 >= 2 ? 'screen16' : 'screen16A';
  }

  return screen.next;
}

/* Final tenet percentages */
function calculatePercentages(scores, maxScores, selfAssessment) {
  const result = {};
  TENET_KEYS.forEach((t) => {
    const raw = scores[t] || 0;
    const max = maxScores[t] || 0;
    let pct = max > 0 ? Math.round((raw / max) * 100) : 0;

    // Metacognitive calibration bonus/penalty on MC
    if (t === 'MC' && selfAssessment) {
      let calibrationAdj = 0;
      TENET_KEYS.forEach((tt) => {
        const simBand = BAND_INDEX[BAND(max > 0 ? Math.round(((scores[tt] || 0) / (maxScores[tt] || 1)) * 100) : 0)];
        const selfBand = selfAssessment[tt] !== undefined ? selfAssessment[tt] : null;
        if (selfBand === null) return;
        const gap = Math.abs(simBand - selfBand);
        if (gap <= 1) calibrationAdj += 1;
        else if (gap >= 3) calibrationAdj -= 1;
      });
      // Average across tenets (rough proxy for the bonus mechanic)
      const avgAdj = TENET_KEYS.length > 0 ? calibrationAdj / TENET_KEYS.length : 0;
      pct = Math.max(0, Math.min(100, pct + Math.round(avgAdj * 5)));
    }

    result[t] = { raw, max, pct, band: BAND(pct) };
  });
  return result;
}

/* ---------- EVIDENCE TRAY SCORING ----------
   Breadth (→ SM): unique categories represented in saved items
   Alignment (→ CJ): does final recommendation match saved high-risk evidence? */

function scoreTrayBreadth(tray) {
  const cats = new Set(tray.map((item) => SAVEABLE_ITEMS[item.id]?.category).filter(Boolean));
  const n = cats.size;
  if (n >= 4) return 3;
  if (n === 3) return 2;
  if (n === 2) return 1;
  return 0;
}

function scoreTrayAlignment(tray, finalRecommendationChoice) {
  /* finalRecommendationChoice = Screen 25 option ID (A, B, C, D) */
  const highRiskCount = tray.filter((item) => SAVEABLE_ITEMS[item.id]?.risk === 'high').length;
  const choice = finalRecommendationChoice;

  /* D = delay/phased (most cautious, fully addresses risks)
     A = partial delay (largely addresses)
     B = conditional go (partially addresses)
     C = full go (contradicts cautious evidence)  */

  if (!choice) return 0;
  if (choice === 'D') {
    if (highRiskCount >= 3) return 3;
    if (highRiskCount >= 1) return 2;
    return 2; // recommendation still aligns with caution
  }
  if (choice === 'A') {
    if (highRiskCount >= 3) return 2;
    if (highRiskCount >= 1) return 2;
    return 1;
  }
  if (choice === 'B') {
    if (highRiskCount >= 2) return 1;
    return 1;
  }
  if (choice === 'C') {
    if (highRiskCount >= 2) return 0; // saved high-risk evidence but recommended full go
    if (highRiskCount === 1) return 1;
    return 1;
  }
  return 0;
}

/* ---------- HELPERS ---------- */

function interp(str, vars) {
  if (typeof str !== 'string') return str;
  return str.replace(/\{(\w+)\}/g, (_, k) => vars[k] || '');
}

function resolveText(screen, history, key) {
  if (!screen.variants || !screen.variantSource) return screen[key];
  const sourceEntry = [...(history || [])].reverse().find((h) => h.screen === screen.variantSource);
  if (!sourceEntry) return screen[key];
  const variant = screen.variants[sourceEntry.optionId];
  if (variant === undefined || variant === null) return screen[key];
  if (typeof variant === 'string') return variant;
  if (variant[key] !== undefined) return variant[key];
  return screen[key];
}

/* ---------- VIEWPORT HOOK ---------- */
function useIsMobile(breakpoint = 768) {
  const [isMobile, setIsMobile] = useState(
    typeof window !== 'undefined' ? window.innerWidth < breakpoint : false
  );
  React.useEffect(() => {
    if (typeof window === 'undefined') return;
    const check = () => setIsMobile(window.innerWidth < breakpoint);
    check();
    window.addEventListener('resize', check);
    return () => window.removeEventListener('resize', check);
  }, [breakpoint]);
  return isMobile;
}

/* ---------- SAVE BUTTON ---------- */

function SaveButton({ saveableId, tray, onSave, darkMode = false, inline = false }) {
  if (!saveableId || !SAVEABLE_ITEMS[saveableId]) return null;
  const alreadySaved = tray.some((item) => item.id === saveableId);
  const baseColor = darkMode ? TOKENS.goldLight : TOKENS.muted;
  const activeColor = darkMode ? TOKENS.gold : TOKENS.gold;
  const borderColor = darkMode ? 'rgba(245,241,232,0.25)' : TOKENS.rule;

  if (alreadySaved) {
    return (
      <span style={{
        display: 'inline-flex',
        alignItems: 'center',
        fontSize: 10,
        color: activeColor,
        fontWeight: 600,
        fontFamily: TOKENS.fontMono,
        letterSpacing: '0.1em',
        textTransform: 'uppercase',
      }}>
        <span style={{ marginRight: 6 }}>✓</span> Saved to evidence
      </span>
    );
  }

  return (
    <button
      onClick={() => onSave(saveableId)}
      style={{
        display: 'inline-flex',
        alignItems: 'center',
        fontSize: 10,
        color: baseColor,
        background: 'transparent',
        border: `1px solid ${borderColor}`,
        borderRadius: 0,
        padding: '4px 10px',
        cursor: 'pointer',
        fontFamily: TOKENS.fontMono,
        letterSpacing: '0.1em',
        textTransform: 'uppercase',
        fontWeight: 500,
        transition: 'all 200ms ease',
      }}
      onMouseEnter={(e) => { e.currentTarget.style.borderColor = activeColor; e.currentTarget.style.color = activeColor; }}
      onMouseLeave={(e) => { e.currentTarget.style.borderColor = borderColor; e.currentTarget.style.color = baseColor; }}
    >
      <span style={{ marginRight: 6 }}>+</span> Save
    </button>
  );
}

function EmailSenderAvatar({ name, size }) {
  size = size || 40;
  const cleanName = (name || '').replace(/\s*\([^)]+\)\s*$/, '').trim();
  const data = PORTRAIT_PHOTOS[cleanName];
  const [imgError, setImgError] = React.useState(false);
  if (data && !imgError) {
    return (
      <div style={{ width: size, height: size, borderRadius: '50%', overflow: 'hidden', flexShrink: 0, border: `2px solid ${data.accent}44` }}>
        <img src={data.url} alt={cleanName} onError={() => setImgError(true)}
          style={{ width: '100%', height: '100%', objectFit: 'cover', objectPosition: 'center 15%', display: 'block' }} />
      </div>
    );
  }
  const palette = ['#1A73E8', '#188038', '#D93025', '#F29900', '#9334E6', '#0F9D58'];
  let hash = 0;
  for (let j = 0; j < (name || '').length; j++) hash = ((hash << 5) - hash) + name.charCodeAt(j);
  const avatarColor = palette[Math.abs(hash) % palette.length];
  return (
    <div style={{ width: size, height: size, borderRadius: '50%', background: avatarColor, color: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'Roboto, sans-serif', fontSize: Math.round(size * 0.44), fontWeight: 500, flexShrink: 0 }}>
      {(name || '?').charAt(0).toUpperCase()}
    </div>
  );
}

    if (secondsLeft <= 0) return;
    const t = setTimeout(() => setSecondsLeft((s) => s - 1), 1000);
    return () => clearTimeout(t);

  React.useEffect(() => {
    if (revealed >= screen.body.length) return;

function EvidenceReviewScreen({ state, onNext }) {
  const isMobile = useIsMobile();
  const tray = state.tray || [];

  /* Group by category */
  const grouped = tray.reduce((acc, item) => {
    const meta = SAVEABLE_ITEMS[item.id];
    if (!meta) return acc;
    const cat = meta.category;
    if (!acc[cat]) acc[cat] = [];
    acc[cat].push({ ...item, ...meta });
    return acc;
  }, {});

  const orderedCategories = ['quality', 'political', 'interpersonal', 'financial'];
  const usedCategories = orderedCategories.filter(c => grouped[c] && grouped[c].length > 0);

  return (
    <div style={{
      minHeight: '100vh',
      background: TOKENS.paper,
      padding: isMobile ? '40px 16px 60px' : '64px 24px 80px',
      animation: 'fadeIn 600ms ease-out',
    }}>
      <div style={{ maxWidth: 900, margin: '0 auto' }}>
        {/* Header */}
        <div style={{ textAlign: 'center', marginBottom: 40 }}>
          <div style={{
            fontFamily: TOKENS.fontMono, fontSize: 10,
            color: TOKENS.gold, letterSpacing: '0.32em',
            textTransform: 'uppercase', fontWeight: 600, marginBottom: 12,
          }}>Before You Enter the Room</div>
          <h1 style={{
            fontFamily: TOKENS.fontDisplay, fontSize: isMobile ? 36 : 48,
            fontWeight: 400, fontStyle: 'italic',
            color: TOKENS.navy, margin: '0 0 16px 0',
            lineHeight: 1.1,
          }}>Review your evidence</h1>
          <div style={{ height: 1, width: 60, background: TOKENS.gold, margin: '0 auto 24px' }} />
          <p style={{
            fontFamily: TOKENS.fontDisplay, fontSize: 19, lineHeight: 1.6,
            color: TOKENS.inkSoft, fontStyle: 'italic',
            maxWidth: 560, margin: '0 auto',
          }}>
            Take a moment to look over what you've gathered. The steering committee is about to ask for your recommendation — what you've saved will shape how you make your case.
          </p>
        </div>

        {/* Summary stats */}
        <div style={{
          display: 'grid',
          gridTemplateColumns: isMobile ? 'repeat(2, 1fr)' : 'repeat(4, 1fr)',
          gap: 1,
          background: TOKENS.rule,
          border: `1px solid ${TOKENS.rule}`,
          marginBottom: 40,
        }}>
          <SummaryStat num={tray.length} label="Items saved" tone={TOKENS.navy} />
          <SummaryStat num={usedCategories.length} label="Categories" tone={TOKENS.teal} sub={`of 4 possible`} />
          <SummaryStat num={tray.filter(i => SAVEABLE_ITEMS[i.id]?.risk === 'high').length} label="High-risk items" tone={TOKENS.coral} />

        </div>

          <div style={{
            padding: '40px 32px',
            background: TOKENS.cream,
            border: `1px solid ${TOKENS.rule}`,
            textAlign: 'center',
            marginBottom: 40,
          }}>
            <div style={{
              fontFamily: TOKENS.fontDisplay, fontSize: 19,
              color: TOKENS.coral, fontStyle: 'italic',

            <p style={{
              fontFamily: TOKENS.fontDisplay, fontSize: 15, lineHeight: 1.6,

                    fontFamily: TOKENS.fontDisplay, fontSize: 22,
                    color: TOKENS.navy, fontWeight: 500,

function RadarChart({ results }) {
  const size = 360, cx = size / 2, cy = size / 2, maxR = 130;
  const tenets = TENET_KEYS;
  const angleStep = (Math.PI * 2) / tenets.length;
  const startAngle = -Math.PI / 2;

  const dataPoints = tenets.map((t, i) => {
    const pct = results[t].pct / 100;
    const r = pct * maxR;
    const angle = startAngle + i * angleStep;
    return { x: cx + Math.cos(angle) * r, y: cy + Math.sin(angle) * r, pct, key: t };
  });

  const labelPoints = tenets.map((t, i) => {
    const r = maxR + 28;
    const angle = startAngle + i * angleStep;
    return { x: cx + Math.cos(angle) * r, y: cy + Math.sin(angle) * r, key: t };
  });

  const gridLevels = [0.25, 0.5, 0.75, 1.0];
  const polygonPath = dataPoints.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ') + ' Z';

  return (
    <svg width={size} height={size + 20} viewBox={`0 0 ${size} ${size + 20}`}>
      {gridLevels.map((level, i) => {
        const points = tenets.map((_, ti) => {
          const angle = startAngle + ti * angleStep;
          const r = level * maxR;
          return `${cx + Math.cos(angle) * r},${cy + Math.sin(angle) * r}`;
        }).join(' ');
        return <polygon key={i} points={points} fill="none" stroke={TOKENS.ruleSoft} strokeWidth="1" />;
      })}
      {tenets.map((_, i) => {
        const angle = startAngle + i * angleStep;
        return <line key={i} x1={cx} y1={cy} x2={cx + Math.cos(angle) * maxR} y2={cy + Math.sin(angle) * maxR} stroke={TOKENS.ruleSoft} strokeWidth="0.8" />;
      })}
      <path d={polygonPath} fill={TOKENS.gold} fillOpacity="0.15" stroke={TOKENS.gold} strokeWidth="2" strokeLinejoin="round" />
      {dataPoints.map((p, i) => (
        <circle key={i} cx={p.x} cy={p.y} r="4" fill={TOKENS.gold} stroke={TOKENS.cream} strokeWidth="2" />
      ))}
      {labelPoints.map((p, i) => (
        <text key={i} x={p.x} y={p.y} textAnchor="middle" dominantBaseline="middle"
              fontFamily="IBM Plex Mono" fontSize="11" fontWeight="600"
              fill={TOKENS.navy} letterSpacing="0.1em">{tenets[i]}</text>
      ))}
    </svg>
  );
}

function CrossroadsSimulation() {
  const [state, setState] = useState({
    currentScreen: 'screen01',
    participant: { name: 'Reader', role: '', function: '', commNorms: '' },
    scores: {}, maxScores: {}, history: [],
    rahulPath: null, meeraPath: null,
    tray: [], finalRecommendation: null,
  });
  const [trayExpanded, setTrayExpanded] = useState(false);
  const [showOnboard, setShowOnboard] = useState(false);
  /* Show onboarding nudge first time user reaches the briefing (screen04) */
  React.useEffect(() => {
    if (state.currentScreen === 'screen04' && state.tray.length === 0 && !state._onboardShown) {
      setShowOnboard(true);
      setState(s => ({ ...s, _onboardShown: true }));
    }
  }, [state.currentScreen]);
  const dismissOnboard = () => setShowOnboard(false);

  const screen = SCREENS[state.currentScreen];
  if (!screen) return <div style={{ padding: 40, color: TOKENS.coral }}>Screen not found: {state.currentScreen}</div>;

  const vars = { name: state.participant.name || 'Reader' };
  const showTray = !['welcome', 'form', 'results'].includes(screen.type);
  const hideProgressStrip = ['welcome', 'results'].includes(screen.type);
  /* Phase indicator hides on welcome, results, and full-bleed dark screens (phone, boardroom, The Room) */
  const hidePhaseIndicator = ['welcome', 'form', 'results', 'private-message'].includes(screen.type)
    || state.currentScreen === 'screen23' /* The Room — has its own Part IX */
    || (screen.speakerCue !== undefined); /* boardroom screens have their own treatment */
  /* Phase indicator dark mode on dark backgrounds */
  const phaseDark = state.currentScreen === 'screen23';

  const handleSaveItem = (saveableId) => {
    if (state.tray.some((item) => item.id === saveableId)) return;
    setState({ ...state, tray: [...state.tray, { id: saveableId, label: '' }] });
  };

  const handleUpdateLabel = (id, label) => {
    setState({ ...state, tray: state.tray.map((item) => (item.id === id ? { ...item, label } : item)) });
  };

  const handleRemoveItem = (id) => {
    setState({ ...state, tray: state.tray.filter((item) => item.id !== id) });
  };

  const advance = (nextKey) => {
    if (!nextKey) return;
    let path = { ...state };
    if (nextKey === 'screen11') path.rahulPath = 'earned';
    if (nextKey === 'screen11A') path.rahulPath = 'surface';
    if (nextKey === 'screen16') path.meeraPath = 'earned';
    if (nextKey === 'screen16A') path.meeraPath = 'surface';
    setState({ ...path, currentScreen: nextKey });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const handleChoice = (optionId) => {
    const updated = applyChoice(state, state.currentScreen, optionId);
    if (state.currentScreen === 'screen25') updated.finalRecommendation = optionId;
    const next = resolveNextScreen(updated, state.currentScreen);
    let path = { ...updated };
    if (next === 'screen11') path.rahulPath = 'earned';
    if (next === 'screen11A') path.rahulPath = 'surface';
    if (next === 'screen16') path.meeraPath = 'earned';
    if (next === 'screen16A') path.meeraPath = 'surface';
    setState({ ...path, currentScreen: next });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const handleFormSubmit = (data) => {
    setState({ ...state, participant: data, currentScreen: screen.next });
    window.scrollTo({ top: 0 });
  };

/* ============================================================

   ============================================================ */

    setState({

          to { opacity: 1; transform: translateY(0); }
        }
        @keyframes msgIn {
          from { opacity: 0; transform: translateY(8px); }
          to { opacity: 1; transform: translateY(0); }
        }
        @keyframes typing {
          0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
          30% { opacity: 1; transform: translateY(-2px); }
        }
        @keyframes savePulse {
          0%, 100% { box-shadow: 0 0 0 0 rgba(184, 146, 58, 0); }
          50% { box-shadow: 0 0 0 6px rgba(184, 146, 58, 0.18); }
        }
        @keyframes trayPulse {
          0%, 100% { opacity: 0.45; transform: scale(1); }
          50% { opacity: 1; transform: scale(1.3); }
        }
        button:focus-visible {
          outline: 2px solid ${TOKENS.gold};
          outline-offset: 2px;
        }
        input:focus, select:focus, textarea:focus {
          border-color: ${TOKENS.navy} !important;
        }
        ::selection {
          background: ${TOKENS.gold};
          color: ${TOKENS.paper};
        }
        /* Responsive media queries — tablet/mobile */
        @media (max-width: 768px) {
          /* Briefing flip cards stack */
          .cr-card-grid {
            grid-template-columns: 1fr !important;
            gap: 16px !important;
          }
          /* Prithvi stats grid: 4 → 2 columns */
          .cr-stats-grid {
            grid-template-columns: repeat(2, 1fr) !important;
          }
          /* Survey dashboard panels stack */
          .cr-dash-grid {
            grid-template-columns: 1fr !important;
          }
          /* Boardroom placards wrap */
          .cr-boardroom-row {
            flex-wrap: wrap !important;
            justify-content: center !important;
            gap: 12px !important;
          }
          /* Smaller padding on main page containers */
          .cr-page {
            padding: 32px 20px !important;
          }
        }
        @media (max-width: 480px) {
          /* Even tighter on phones */
          .cr-page {
            padding: 24px 14px !important;
          }
          /* Phone screen takes more viewport */
          .cr-phone {
            transform: rotate(0deg) !important;
          }
        }
      `}</style>

      <ProgressStrip screenKey={state.currentScreen} hide={hideProgressStrip} />
      <PhaseIndicator screenKey={state.currentScreen} hide={hidePhaseIndicator} dark={phaseDark} />
      {body}
      {showTray && (
        <EvidenceTray
          tray={state.tray}
          onUpdateLabel={handleUpdateLabel}
          onRemove={handleRemoveItem}
          expanded={trayExpanded}
          setExpanded={setTrayExpanded}
        />
      )}
      <EvidenceTrayOnboard visible={showOnboard} onDismiss={dismissOnboard} />
    </div>
  );
}


const container = document.getElementById('root');
const root = ReactDOM.createRoot(container);
root.render(React.createElement(CrossroadsSimulation));
} catch (e) {
  document.getElementById('root').innerHTML = '<div class="boot-error"><h2>Runtime error during initial render</h2><pre>' + (e.message || e) + '\n\n' + (e.stack || '') + '</pre></div>';
}
</script>
</body>
</html>
